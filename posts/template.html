<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <title>
        <replace variable="page_title" placeholder="title" delimiter="">title</replace>
    </title>
    <link rel="stylesheet" href="/posts/post.css" />
</head>

<body>
    <include path="menubar.html" />
    <div id="content" class="section">
        <replace variable="title" placeholder="title" delimiter="">
            <header>title</header>
        </replace>
        <article>
            <replace variable="body" placeholder="body" delimiter="">body</replace>
        </article>
    </div>
    <if expression="tags or authors or date">
        <div id="foot" class="status-bar section">
    </if>
    <if expression="tags">
        <p id="tag-field" class="status-bar-field">
    </if>
    <if expression="tags"> Etiketler: </if>
    <replace variable="tags" placeholder="tag" delimiter=", ">tag</replace>
    <if expression="tags">
        </p>
    </if>
    <if expression="authors">
        <p id="author-field" class="status-bar-field">
    </if>
    <if expression="authors">Yazan: </if>
    <replace variable="authors" placeholder="author" delimiter=", ">author</replace>
    <if expression="authors">
        </p>
    </if>
    <if expression="date">
        <p id="date-field" class="status-bar-field"></p>
    </if>
    <if expression="date">Tarih: </if>
    <replace variable="date" placeholder="date" delimiter=", ">date</replace>
    <if expression="date">
        </p>
    </if>
    <if expression="tags or authors or date">
        </div>
    </if>
</body>

</html>
